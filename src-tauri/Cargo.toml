[package]
name = "mdir4"
version = "0.5.0"
description = "Mdir4 — keyboard-first dual-pane file manager for Windows, macOS and Linux"
authors = ["Mdir4"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
walkdir = "2"
trash = "5"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
zip = "2"
filetime = "0.2.29"
open = "5.4.4"
fs2 = "0.4"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSControl", "NSFont", "NSFontManager", "NSFontPanel", "NSGraphics", "NSPanel", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
pango = "0.18"

[dev-dependencies]
tempfile = "3"

[features]
# by default Tauri will look for icons in the 'icons' folder
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
