[package]
name = "mdir4"
version = "1.0.0"
description = "Mdir4 — keyboard-first dual-pane file manager for Windows, macOS and Linux"
authors = ["Mdir4"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
walkdir = "2"
trash = "5"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
zip = "2"
filetime = "0.2.29"
open = "5.4.4"

[dev-dependencies]
tempfile = "3"

[features]
# by default Tauri will look for icons in the 'icons' folder
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
